services:
  web:
    build:
      context: .
    ports:
      - "8080:80"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/var/www/html

  db:
    image: mariadb:10.5
    environment:
      MARIADB_DATABASE: ${DB_NAME:-maiteam}
      MARIADB_USER: ${DB_USER:-maiteam_app}
      MARIADB_PASSWORD: ${DB_PASS:-maiteam_dev_password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-maiteam_root_password}
    volumes:
      - db_data:/var/lib/mysql
      - ./maiteam.sql:/docker-entrypoint-initdb.d/001-maiteam.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db_data:
